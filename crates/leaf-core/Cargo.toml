[package]
name = "leaf-core"
version = "0.1.0"
edition = "2021"

[dependencies]
indexmap = "2"
flate2 = "1"
md-5 = "0.10"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
serde_json = "1"
rsa = { version = "0.9", features = ["sha2"] }
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
